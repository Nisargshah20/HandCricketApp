// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    // Pin androidx.browser: 1.9.0 requires compileSdk 36 + AGP 8.9.1; 1.8.0 is
    // compatible and enough (we use Google Credential Manager, not browser flows).
    configurations.all {
        resolutionStrategy {
            force 'androidx.browser:browser:1.8.0'
        }
    }
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        project.tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = JavaVersion.VERSION_17.toString()
            targetCompatibility = JavaVersion.VERSION_17.toString()
        }
        project.tasks.matching { it.name.contains("Kotlin") || it.name.contains("kotlin") }.configureEach { task ->
            if (task.hasProperty('kotlinOptions')) {
                try {
                    task.kotlinOptions.jvmTarget = "17"
                } catch (Exception e) {}
            }
            if (task.hasProperty('compilerOptions')) {
                try {
                    task.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                } catch (Exception e) {}
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
